[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mikecedwin-hparamsens"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告微调超参的敏感区间相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mikecedwin" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mikecedwin.github.io"
Repository = "https://github.com/mikecedwin/hparamsens"
Issues = "https://github.com/mikecedwin/hparamsens/issues"

[project.scripts]
hparamsens = "hparamsens:main"

[tool.setuptools]
py-modules = ["hparamsens"]
